<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .post-card { border: 1px solid #ddd; padding: 15px; margin: 12px 0; border-radius: 5px; }
        .post-meta { font-size: 0.85rem; color: #666; margin-bottom: 8px; }
        nav button { margin-right: 5px; padding: 6px 12px; cursor: pointer; }
        input, textarea { width: 100%; max-width: 400px; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { cursor: pointer; padding: 6px 12px; }
        .delete-btn { color: red; border: 1px solid red; background: transparent; border-radius: 3px; font-size: 0.8rem; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>Placeholder</h2>

    <!-- AUTHENTICATION FORM -->
    <div id="auth-section">
        <h3>Register/Login</h3>
        <input type="text" id="username" placeholder="Pick a username" required><br>
        <input type="email" id="email" placeholder="Enter your email" required><br>
        <input type="password" id="password" placeholder="Enter password (min 6 characters)" required><br>
        <button onclick="signIn()">Login</button>
        <button onclick="signUp()">Register</button>
    </div>

    <!-- LOGGED IN ACCOUNT ROW -->
    <div id="user-section" style="display: none;">
        <p>Posting as: <strong id="display-user-handle"></strong></p>
        <button onclick="signOut()">Leave / Switch Account</button>
    </div>

    <br>
    <!-- TOP BOARDS SWITCHER -->
    <nav>
        <button onclick="switchBoard('General')">📢 General</button>
        <button onclick="switchBoard('Gaming')">🎮 Gaming</button>
        <button onclick="switchBoard('Tech')">💻 Tech</button>
    </nav>

    <h3 id="board-title">Board: General</h3>

    <!-- CREATE SUBMISSION WRAPPER -->
    <div id="publish-section" style="display: none;">
        <textarea id="post-content" rows="4" placeholder="Drop a post..."></textarea><br>
        <button onclick="publishPost()">Publish Post</button>
    </div>
    <p id="auth-warning">Please login to post.</p>

    <hr>

    <!-- LIVE POST LIST -->
    <div id="posts-container">Loading posts...</div>

    <script>
        let supabase = null;
        let currentUser = null;
        let currentBoard = 'General';

        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('posts-container');
            
            if (typeof window.supabase === 'undefined') {
                container.innerHTML = '<b style="color:red">Network Error: The Supabase library failed to download. Please refresh the page.</b>';
                return;
            }

            if (SUPABASE_URL === 'YOUR_SUPABASE_URL' || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {
                container.innerHTML = '<b style="color:orange">Config Warning: Insert your real Supabase URL & Key in the code.</b>';
                return;
            }

            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                initAuthListener();
            } catch (e) {
                console.error(e);
            }
        });

        function initAuthListener() {
            if (!supabase) return;
            supabase.auth.onAuthStateChange((event, session) => {
                const authSection = document.getElementById('auth-section');
                const userSection = document.getElementById('user-section');
                const publishSection = document.getElementById('publish-section');
                const authWarning = document.getElementById('auth-warning');
                const handleSpan = document.getElementById('display-user-handle');

                if (session) {
                    currentUser = session.user;
                    authSection.style.display = 'none';
                    userSection.style.display = 'block';
                    publishSection.style.display = 'block';
                    authWarning.style.display = 'none';
                    handleSpan.innerText = (currentUser.user_metadata && currentUser.user_metadata.username) || currentUser.email;
                } else {
                    currentUser = null;
                    authSection.style.display = 'block';
                    userSection.style.display = 'none';
                    publishSection.style.display = 'none';
                    authWarning.style.display = 'block';
                }
                loadPosts();
            });
        }

        async function signUp() {
            if (!supabase) return alert("Supabase configuration missing.");
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !email || !password) return alert("Please fill out all fields.");
            
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: { data: { username: username } }
            });

            if (error) {
                alert("Registration error: " + error.message);
            } else {
                alert("Success! Check your email inbox to verify your account before logging in.");
            }
        }

        async function signIn() {
            if (!supabase) return alert("Supabase configuration missing.");
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return alert("Please fill in email and password.");

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert("Sign In failed: " + error.message);
        }

        async function signOut() {
            if (supabase) await supabase.auth.signOut();
        }

        function switchBoard(boardName) {
            currentBoard = boardName;
            document.getElementById('board-title').innerText = `Board: ${boardName}`;
            if (supabase) loadPosts();
        }

        async function publishPost() {
            if (!supabase || !currentUser) return alert("You must be signed in to post.");
            const textInput = document.getElementById('post-content');
            if (!textInput.value.trim()) return alert("Post content cannot be empty.");

            const usernameString = (currentUser.user_metadata && currentUser.user_metadata.username) || "Anonymous";

            const { error } = await supabase
                .from('posts')
                .insert([{ 
                    content: textInput.value, 
                    board: currentBoard, 
                    user_id: currentUser.id,
                    username: usernameString
                }]);

            if (error) {
                alert("Could not publish post: " + error.message);
            } else {
                textInput.value = '';
                loadPosts();
            }
        }

        async function loadPosts() {
            if (!supabase) return;
            const container = document.getElementById('posts-container');
            container.innerHTML = 'Loading posts...';

            const { data: posts, error } = await supabase
                .from('posts')
                .select('*')
                .eq('board', currentBoard)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<b style="color:red">Database fetch error.</b>';
                return console.error(error);
            }

            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<em>No posts in this board yet.</em>';
                return;
            }

            posts.forEach(post => {
                const postDiv = document.createElement('div');
                postDiv.className = 'post-card';

                const isContentDeleted = post.content === null || post.content.trim() === "";
                const textDisplay = isContentDeleted 
                    ? "<em>[This post's content has been removed by the author]</em>" 
                    : post.content;

                postDiv.innerHTML = `
                    <div class="post-meta"><strong>@${post.username || 'unknown'}</strong></div>
                    <p>${textDisplay}</p>
                `;

                if (currentUser && currentUser.id === post.user_id && !isContentDeleted) {
                    const clearBtn = document.createElement('button');
                    clearBtn.className = 'delete-btn';
                    clearBtn.innerText = "Clear Content";
                    clearBtn.onclick = () => eraseContent(post.id);
                    postDiv.appendChild(clearBtn);
                }

                container.appendChild(postDiv);
            });
        }

        async function eraseContent(postId) {
            if (!supabase) return;
            if (!confirm("Are you sure you want to delete this content? The post container will remain on the board.")) return;

            const { error } = await supabase
                .from('posts')
                .update({ content: null }) 
                .eq('id', postId);

            if (error) {
                alert("Could not erase content: " + error.message);
                } else {
loadPosts();
}
}
